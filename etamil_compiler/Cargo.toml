# etamil_compiler/Cargo.toml
# eTamil-Compiler: A Rust-based DSL Compiler for Tamil/Latin Bilingual FinTech
#
# Dependency policy: this file lists only crates the compiled code actually
# uses. Crates for planned work (sqlx/mongodb/oracle for real database
# backends, axum/futures for the async server drafted in
# src/http/async_mod.rs) are deliberately absent — add them back in the commit
# that starts using them. See docs/ROADMAP.md.

[package]
name = "etamil_compiler"
version = "0.2.0"
edition = "2024"          # requires Rust 1.85+
rust-version = "1.85"
authors = ["Esan Maruff <esan@etamil.in>"]
description = "Bilingual (Tamil/Latin) FinTech DSL Compiler for Indian Regulatory Compliance"
license = "AGPL-3.0-or-later"
license-file = "../LICENSE"
repository = "https://github.com/Maruff/etamil_compiler"
homepage = "https://etamil.in"

# The user-facing binary is `etamil`; the library target is `etamil_compiler`.
[[bin]]
name = "etamil"
path = "src/main.rs"

[dependencies]
# --- Compiler front end ---
# Fast lexer for bilingual (Tamil script / romanized) tokenization.
# 0.16.1 or newer: earlier patch releases lack the allow_greedy option that
# the line-comment skip pattern in lexer.rs needs.
logos = "0.16.1"

# --- Text ---
# String length and indexing count grapheme clusters, not code points: in
# Tamil a written letter such as கு is a consonant plus a vowel sign, and
# நீளம்("வணக்கம்") must be 5, not 7.
unicode-segmentation = "1.11"

# --- Numbers ---
# Every value in the language is a fixed-point decimal, not f64: this is a
# language for tax and accounting, where 0.1 + 0.2 must equal 0.3 exactly.
rust_decimal = "1.37"
# Direct LLVM FFI bindings, enabled with --features llvm (Linux/macOS only)
llvm-sys = { version = "180", features = ["prefer-dynamic"], optional = true }

# --- Runtime & HTTP server ---
# The sync server uses std::net; tokio provides the async runtime for main,
# the cache TTL timers, and the resilience module.
tokio = { version = "1.37", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "net", "fs", "signal"] }

# --- Serialization, auth, and telemetry ---
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4.35", features = ["serde"] }
jsonwebtoken = "9.2"
bcrypt = "0.15"
uuid = { version = "1.6", features = ["v4", "serde"] }

# --- Database ---
# Blocking drivers throughout, which suit a synchronous VM behind a
# thread-per-request server. "bundled" compiles SQLite itself so there is no
# system dependency.
rusqlite = { version = "0.32", features = ["bundled"], optional = true }
postgres = { version = "0.19", optional = true }
# "minimal" leaves out TLS and the compression backends: a driver pulling in
# OpenSSL would put a C build back in the way of a plain `cargo build`, which
# is the thing the bundled SQLite exists to avoid.
mysql = { version = "25", optional = true, default-features = false, features = ["minimal"] }
# Needed to write the ToSql impl that adapts a value to the column's type:
# without it a number bound to an INT column is refused, because Decimal
# alone only accepts NUMERIC.
bytes = { version = "1", optional = true }

[features]
# Optional LLVM code generation (not available on Windows)
llvm = ["llvm-sys"]
sqlite = ["rusqlite"]
# `dep:` keeps the optional dependency from also creating a feature of its
# own name, so this one can pull in the decimal integration alongside it.
postgres = ["dep:postgres", "dep:bytes", "rust_decimal/db-postgres"]
mysql = ["dep:mysql"]
default = ["sqlite"]

[profile.release]
# The headline feature is a small standalone binary, so optimize for that.
lto = true
codegen-units = 1
strip = true
