# Gradle needs a heap this size to build an Android app at all; the default 512m
# fails partway through with an out-of-memory that names no cause.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# file.encoding above is not decoration. The Kotlin sources and the string
# resources are full of Tamil, and a JVM that defaults to a single-byte encoding
# — which is still what a bare Windows JVM does — reads them as mojibake and
# compiles the mojibake in.
android.useAndroidX=true
org.gradle.parallel=true
org.gradle.caching=true

# The Rust library is built by cargo-ndk before Gradle runs and dropped into
# src/main/jniLibs, so Gradle never invokes cargo. Two build tools each thinking
# they own the other's output is a worse problem than one extra CI step.
android.nonTransitiveRClass=true
