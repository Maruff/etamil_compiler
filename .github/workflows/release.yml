# Publish packages for Windows, Linux and macOS.
#
#   git tag v0.3.0 && git push origin v0.3.0
#
# Each platform builds on its own runner. Nothing is cross-compiled except the
# musl target, which is what lets the Linux binary run on distributions older
# than the one that built it.
name: Release packages

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  package:
    name: package (${{ matrix.package }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            package: etamil-linux-x64.tar.gz
            setup: musl
          # macOS is two genuinely different binaries. Shipping only the Intel
          # one would leave every Apple Silicon machine — which is every Mac
          # sold for years — with a package it cannot run.
          # Cross-compiled on the Apple Silicon runner: the macos-13 label is
          # being retired and a job asking for it queues forever rather than
          # failing, which is the worst of both.
          - os: macos-latest
            target: x86_64-apple-darwin
            package: etamil-macos-x64.tar.gz
            setup: native
          - os: macos-latest
            target: ''
            package: etamil-macos-arm64.tar.gz
            setup: native
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            package: etamil-windows-x64.zip
            setup: native

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl toolchain
        if: matrix.setup == 'musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      # Enabled for the packages only: someone downloading a binary cannot add
      # a cargo feature to it later. LLVM stays out — it needs LLVM present on
      # the machine that runs the compiler.
      - name: Build package
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          FEATURES: postgres,mysql
        run: bash packaging/build.sh

      - name: Verify archive exists
        shell: bash
        run: test -s "dist/${{ matrix.package }}"

      # A package that cannot run its own examples is not a package, and
      # finding that out after publishing is worse than failing here.
      - name: Run the packaged binary
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          case "${{ matrix.package }}" in
            *.zip)  unzip -q "${{ matrix.package }}" ;;
            *.tar.gz) tar xzf "${{ matrix.package }}" ;;
          esac
          DIR="$(basename "${{ matrix.package }}" .tar.gz)"
          DIR="$(basename "$DIR" .zip)"
          BIN="$DIR/etamil"
          if [ -f "$BIN.exe" ]; then
            BIN="$BIN.exe"
          fi
          export ETAMIL_PATH="$PWD/$DIR"
          "$BIN" --version
          echo "950000" | "$BIN" --vm "$DIR/examples/basic_samples/example.qmz" | grep -q "High Tax Bracket"
          "$BIN" --vm "$DIR/examples/finance/kaNakkiyal.qmz" | grep -q "சொத்து"
          printf 'இறக்கு "nUlakam/paNam.qmz";\nஅச்சு ரூபாய்(12345678.5);\n' > money.qmz
          "$BIN" --vm money.qmz | grep -q "1,23,45,678.50"
          echo "packaged binary works"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package }}
          path: |
            dist/${{ matrix.package }}
            dist/${{ matrix.package }}.sha256
          if-no-files-found: error

  publish:
    name: publish release assets
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List what will be published
        run: ls -lh dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
